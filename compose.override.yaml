---
services:
  caddy:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "127.0.0.1:9099:9099" # metrics
    networks:
      default:
      proxy_net:
        aliases: # without this, the services will not be able to resolve each other by name
          - "${WALLET_CADDY_FRONTEND_FQDN:-wallet.localhost}"
          - "${WALLET_CADDY_BACKEND_FQDN:-backend.localhost}"
          - "${WALLET_CADDY_ISSUER_FQDN:-issuer.localhost}"
          - "${WALLET_CADDY_VERIFIER_FQDN:-verifier.localhost}"
          - "${WALLET_CADDY_CORE_FQDN:-core.localhost}"
          - "${WALLET_CADDY_GOBACKEND_FQDN:-gobackend.localhost}"


  wwwallet-issuer-poc:
    networks:
      - proxy_net

  k6:
    scale: 0 # disable k6

  wallet-frontend:
    networks:
      - proxy_net
  wallet-backend:
    profiles: ["backend"]
    networks:
      - proxy_net 

  go-wallet-backend:
    profiles: ["go-backend"]
    networks:
      - proxy_net
      - default

  wallet-issuer:
    networks:
      - proxy_net 

  wallet-verifier:
    networks:
      - proxy_net 

networks:
  proxy_net:
    internal: true
