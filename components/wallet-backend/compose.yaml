---
services:
  wallet-backend:
    # image: wallet-backend-server:${WWALLET_BACKEND_TAG:-v0.2.9}
    build:
      context: ${WALLET_BACKEND_BUILD_CONTEXT:-https://github.com/wwwallet/wallet-backend-server.git#f39dd39b8443ed8b2632ccb9e2fcb1d73b093c78}
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./config.js:/app/dist/config/index.js:ro
      - ./keys:/app/keys:ro
    ports:
      - 127.0.0.1:8002:8002
    depends_on:
      wallet-backend_db:
        condition: service_healthy
    networks:
      - default # wallet-backend proxies connections for users, so it needs access to all issuers
      - wallet-backend_db_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client, json; conn = http.client.HTTPConnection('localhost', 8002); conn.request('GET', '/status'); res = conn.getresponse(); data = res.read().decode(); print(data); exit(0 if json.loads(data)['status'] == 'ok' else 1)"]
      interval: 30s
      start_period: 10s
      timeout: 5s
      retries: 3

  wallet-backend_db:
    image: mariadb:lts
    restart: always
    environment:
      - MARIADB_DATABASE=${WALLET_BACKEND_DATABASE:-wallet}
      - MARIADB_USER=${WALLET_BACKEND_USER:-wallet}
      - MARIADB_PASSWORD=${WALLET_BACKEND_PASSWORD:-wallet}
      - MARIADB_RANDOM_ROOT_PASSWORD=${WALLET_BACKEND_RANDOM_ROOT_PASSWORD:-1}
    volumes:
      - wallet-backend_db:/var/lib/mysql
    networks:
      - wallet-backend_db_net
    healthcheck: # https://mariadb.com/docs/server/server-management/install-and-upgrade-mariadb/installing-mariadb/binary-packages/automated-mariadb-deployment-and-administration/docker-and-mariadb/using-healthcheck-sh
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  wallet-backend_db_inject_verifier_issuer:
    image: mariadb:lts
    environment:
      - MARIADB_DATABASE=${WALLET_BACKEND_DATABASE:-wallet}
      - MARIADB_USER=${WALLET_BACKEND_USER:-wallet}
      - MARIADB_PASSWORD=${WALLET_BACKEND_PASSWORD:-wallet}
      - MARIADB_RANDOM_ROOT_PASSWORD=${WALLET_BACKEND_RANDOM_ROOT_PASSWORD:-1}
      - WALLET_BACKEND_TRUSTED_ROOT=${WALLET_BACKEND_TRUSTED_ROOT:-}
      - WALLET_ISSUER_URL=${WALLET_ISSUER_URL:-https://issuer.localhost}
      - WALLET_VERIFIER_URL=${WALLET_VERIFIER_URL:-https://verifier.localhost}
    networks:
      - wallet-backend_db_net
    volumes:
      - ./init-sql.sh:/init-sql.sh
    entrypoint: "bash /init-sql.sh" 
    depends_on:
      wallet-backend:
          condition: service_healthy
      wallet-backend_db:
          condition: service_healthy

volumes:
  wallet-backend_db:

networks:
  wallet-backend_db_net:
    internal: true