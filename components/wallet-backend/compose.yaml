---
services:
  wallet-backend:
#    image: ghcr.io/wwwallet/wallet-backend-server:${WALLET_BACKEND_TAG:-v0.4.0}
    build:
      context: ${WALLET_BACKEND_BUILD_CONTEXT:-https://github.com/wwwallet/wallet-backend-server.git#b0848c9c5f59dfedcdeb0c8ffd57cb7a7d2fb3a0}
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./config.js:/app/dist/config/index.js:ro
      - ./keys:/app/keys:ro
    ports:
      - 127.0.0.1:8002:8002
    depends_on:
      wallet-backend_db:
        condition: service_healthy
      wallet-backend_db_inject_verifier_issuer:
        condition: service_completed_successfully
    networks:
      - default # wallet-backend proxies connections for users, so it needs access to all issuers
      - wallet-backend_db_net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8002; echo -e 'GET /status HTTP/1.1\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep 'ok'"]
      interval: 10s
      start_period: 10s
      timeout: 5s
      retries: 3

  wallet-backend_db:
    image: mariadb:lts
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=${WALLET_BACKEND_DATABASE:-wallet}
      - MARIADB_USER=${WALLET_BACKEND_USER:-wallet}
      - MARIADB_PASSWORD=${WALLET_BACKEND_PASSWORD:-wallet}
      - MARIADB_RANDOM_ROOT_PASSWORD=${WALLET_BACKEND_RANDOM_ROOT_PASSWORD:-1}
    volumes:
      - wallet-backend_db:/var/lib/mysql
    networks:
      - wallet-backend_db_net
    healthcheck: # https://mariadb.com/docs/server/server-management/install-and-upgrade-mariadb/installing-mariadb/binary-packages/automated-mariadb-deployment-and-administration/docker-and-mariadb/using-healthcheck-sh
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  wallet-backend_db_inject_verifier_issuer:
    image: mariadb:lts
    environment:
      - MARIADB_DATABASE=${WALLET_BACKEND_DATABASE:-wallet}
      - MARIADB_USER=${WALLET_BACKEND_USER:-wallet}
      - MARIADB_PASSWORD=${WALLET_BACKEND_PASSWORD:-wallet}
      - MARIADB_RANDOM_ROOT_PASSWORD=${WALLET_BACKEND_RANDOM_ROOT_PASSWORD:-1}
      - WALLET_BACKEND_TRUSTED_ROOT=${WALLET_BACKEND_TRUSTED_ROOT:-}
      - WALLET_ISSUER_URL=${WALLET_ISSUER_URL:-https://issuer.localhost}
      - WALLET_VERIFIER_URL=${WALLET_VERIFIER_URL:-https://verifier.localhost}
    networks:
      - wallet-backend_db_net
    volumes:
      - ./init-sql.sh:/init-sql.sh:ro
    entrypoint: "bash /init-sql.sh" 
    depends_on:
      wallet-backend_db:
          condition: service_healthy
    deploy:
      mode: replicated-job

volumes:
  wallet-backend_db:

networks:
  wallet-backend_db_net:
    internal: true